name: Docs · publish

on:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # Requires Pages to be enabled once, manually: repo Settings -> Pages ->
      # Build and deployment -> Source: "GitHub Actions". The workflow token
      # cannot create the Pages site itself (that needs repo-admin rights),
      # so this step fails with "Get Pages site failed" until that is done.
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"

      # linux-x64.yml runs this too, but it does not gate the deploy: on a push
      # both workflows start together, so without it here a drifted custom.css
      # publishes while the drift check is still going red beside it.
      - name: Brand drift check
        run: uv run python style/generate_style.py --check

      - name: Build Sphinx docs
        run: uv run --extra docs sphinx-build -W -b html docs docs/_build/html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html

  # develop and master still BUILD, so a broken docs tree goes red there too; only
  # main deploys, because the github-pages environment accepts main alone. Without
  # the gate every develop push ended in a red deploy with no steps.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
