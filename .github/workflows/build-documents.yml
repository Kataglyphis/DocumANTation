name: Build Documents

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  style-check:
    name: Brand, Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.10"

      - name: Brand drift check
        run: uv run python style/generate_style.py --check

      # --extra dev on every step: ruff, ty, pytest and pytest-cov all live in
      # that extra, and so does the theme package tests/test_theme.py imports.
      # Without it a fresh checkout resolves pygments alone and the step dies at
      # "program not found" rather than on a real failure.
      - name: Lint
        run: uv run --extra dev ruff check .

      - name: Format check
        run: uv run --extra dev ruff format --check .

      - name: Type check
        run: uv run --extra dev ty check md2pdfLib style sphinx-kataglyphis-theme

      - name: Test suite
        run: uv run --extra dev pytest tests/ -q

  build-documents:
    name: Build All Documents
    runs-on: ubuntu-latest
    needs: style-check
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Build Docker image
        run: docker build . -t pandoc_all

      - name: Build book
        run: STRICT_WARNINGS=1 ./scripts/build_in_container.sh book
        env:
          CONTAINER_RUNTIME: docker

      - name: Build beamer
        run: STRICT_WARNINGS=1 ./scripts/build_in_container.sh beamer
        env:
          CONTAINER_RUNTIME: docker

      # The primitives showcase, built as its own deck. Its sources sit in a
      # subdirectory of the beamer input dir, which get_sorted_markdown_files()
      # does not descend into -- so nothing built them for a long time and two
      # rotted references sat in them unnoticed. Kept in CI so that cannot recur.
      - name: Build demo
        run: STRICT_WARNINGS=1 ./scripts/build_in_container.sh demo
        env:
          CONTAINER_RUNTIME: docker

      # The starter document a newcomer is told to edit. If `make example` stops
      # working, the first thing anyone tries with this repo stops working.
      - name: Build example
        run: STRICT_WARNINGS=1 ./scripts/build_in_container.sh example
        env:
          CONTAINER_RUNTIME: docker

      - name: Build pptx
        run: STRICT_WARNINGS=1 ./scripts/build_in_container.sh pptx
        env:
          CONTAINER_RUNTIME: docker

      - name: Build CV (English)
        run: STRICT_WARNINGS=1 CV_LANG=english ./scripts/build_in_container.sh cv
        env:
          CONTAINER_RUNTIME: docker

      - name: Build CV (German)
        run: STRICT_WARNINGS=1 CV_LANG=german ./scripts/build_in_container.sh cv
        env:
          CONTAINER_RUNTIME: docker

      - name: Upload artifacts
        uses: actions/upload-artifact@v5.0.0
        with:
          name: documents
          path: |
            data/out/book_output.pdf
            data/out/beamer_output.pdf
            data/out/demo_output.pdf
            data/out/example_output.pdf
            data/out/presentation.pptx
            data/out/CV_Jonas_Heinle_english.pdf
            data/out/CV_Jonas_Heinle_german.pdf
          retention-days: 30
