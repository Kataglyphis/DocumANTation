name: Linux x64 · build + test

# No LaTeX here (the texlive image is ~8.5 GB): build locally with STRICT_WARNINGS=1 ./scripts/build_in_container.sh.

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
  # release.yml runs this lane once more on the commit it releases.
  workflow_call:

# Read-only: the lane checks, it publishes nothing.
permissions:
  contents: read

jobs:
  checks:
    name: Brand, Lint & Tests
    runs-on: ubuntu-26.04
    # About 7 min of it is the image pull.
    timeout-minutes: 45
    steps:
      # No `image:` here or below: the actions default it from the hub's versions.env, its one owner.
      - name: Prepare CI host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          fetch-depth: '1'
          submodules: recursive

      - name: Check out shared Python quality tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Kataglyphis/ANTfrastructure
          ref: develop
          path: antfrastructure-tools
          persist-credentials: false

      - name: Brand, lint, types, shell and tests, Python X.Y
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          script: bash antfrastructure-tools/linux/scripts/ci-image-leg.sh pinned "${PWD}/.venv-leg-pinned" bash scripts/ci-checks.sh

      - name: Brand, lint, types, shell and tests, Python X.Yt
        if: ${{ !cancelled() }}
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          script: bash antfrastructure-tools/linux/scripts/ci-image-leg.sh pinnedt "${PWD}/.venv-leg-pinnedt" bash scripts/ci-checks.sh
