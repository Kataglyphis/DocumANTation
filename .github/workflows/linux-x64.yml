name: Linux x64 · build + test

# No LaTeX here (the texlive image is ~8.5 GB): build locally with STRICT_WARNINGS=1 ./scripts/build_in_container.sh.

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  checks:
    name: Brand, Lint & Tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"

      - name: Brand drift check
        run: uv run python style/generate_style.py --check

      # --extra dev on every step: the tools and the theme tests/test_theme.py imports live there.
      - name: Lint
        run: uv run --extra dev ruff check .

      - name: Format check
        run: uv run --extra dev ruff format --check .

      - name: Type check
        run: uv run --extra dev ty check md2pdfLib style sphinx-kataglyphis-theme

      # git ls-files, so a new script cannot slip past; it skips the beamer/smile submodules.
      - name: Shell lint
        run: git ls-files -z '*.sh' | xargs -0 uv run --extra dev shellcheck

      # The pandoc tests skip without it; the version comes from the Dockerfile so it cannot drift.
      - name: Install pandoc (the version the image pins)
        run: |
          version="$(sed -n 's/^ARG PANDOC_VERSION=//p' Dockerfile)"
          test -n "$version"
          url="https://github.com/jgm/pandoc/releases/download/${version}/pandoc-${version}-1-amd64.deb"
          curl -fsSL -o /tmp/pandoc.deb "$url"
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1

      - name: Test suite
        run: uv run --extra dev pytest tests/ -q
