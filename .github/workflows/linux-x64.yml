name: Linux x64 · build + test

# No LaTeX here (the texlive image is ~8.5 GB): build locally with STRICT_WARNINGS=1 ./scripts/build_in_container.sh.

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

# Read-only: the lane checks, it publishes nothing.
permissions:
  contents: read

jobs:
  checks:
    name: Brand, Lint & Tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Check out shared Python quality tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Kataglyphis/ANTfrastructure
          ref: develop
          path: antfrastructure-tools
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # The family pin, PYTHON_VERSION in ANTfrastructure's linux/scripts/01-core/versions.env; move it with that.
          python-version: "3.15"

      - name: Brand drift check
        run: uv run python style/generate_style.py --check

      - name: Python lint and format
        run: bash antfrastructure-tools/linux/scripts/refactor-python.sh --root "$GITHUB_WORKSPACE" --check

      - name: Type check
        run: bash scripts/check-python-types.sh

      # git ls-files, so a new script cannot slip past; it skips the beamer/smile submodules.
      - name: Shell lint
        run: git ls-files -z '*.sh' | xargs -0 uv run --extra dev shellcheck

      # The pandoc tests skip without it; the version comes from the Dockerfile so it cannot drift.
      - name: Install pandoc (the version the image pins)
        run: |
          version="$(sed -n 's/^ARG PANDOC_VERSION=//p' Dockerfile)"
          test -n "$version"
          url="https://github.com/jgm/pandoc/releases/download/${version}/pandoc-${version}-1-amd64.deb"
          curl -fsSL -o /tmp/pandoc.deb "$url"
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1

      - name: Test suite
        run: uv run --extra dev pytest tests/ -q
