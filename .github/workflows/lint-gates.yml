name: Linux x64 · quality gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    uses: Kataglyphis/ANTfrastructure/.github/workflows/lint-gates.yml@develop
    with:
      submodules: 'true'
      ratchets: true
      hub-checkout: true
