[project]
name = "sphinx-kataglyphis-theme"
version = "0.1.0"
description = "Reusable Sphinx theme config + CSS for Kataglyphis documentation sites"
requires-python = ">=3.14"
# Pinned, not generated (a manifest cannot read JSON); tests/test_identity_is_single_source.py holds it to brand.json.
license = { text = "MIT" }
authors = [{ name = "Jonas Heinle", email = "jonasheinle@googlemail.com" }]
dependencies = [
    "sphinx>=7",
    "sphinx-book-theme>=1",
    "myst-parser>=3",
    "sphinx-design>=0.6",
    "pygments>=2.17",
]

# Real Pygments styles, so the website highlights code like the book and slides.
[project.entry-points."pygments.styles"]
kataglyphis-light = "sphinx_kataglyphis.highlight:KataglyphisLightStyle"
kataglyphis-dark = "sphinx_kataglyphis.highlight:KataglyphisDarkStyle"

[project.urls]
Homepage = "https://jonasheinle.de"
Repository = "https://github.com/Kataglyphis/DocumANTation"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sphinx_kataglyphis"]

[tool.setuptools.package-data]
# Shipping brand.tokens.json lets any installing project read the brand instead of copying values.
sphinx_kataglyphis = ["_static/css/*.css", "brand.tokens.json"]
