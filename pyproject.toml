[project]
name = "kataglyphis-md2pdf"
version = "0.1.0"
description = "Convert Markdown into modern LaTeX books, beamer slides, pptx decks and CVs via Pandoc + LuaLaTeX."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Jonas Heinle", email = "jonasheinle@googlemail.com" }]
keywords = ["pandoc", "latex", "markdown", "pdf", "beamer", "documentation"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Documentation",
]
# Pandoc and a TeX distribution are system dependencies the container provides.
dependencies = ["pygments>=2.17"]

[project.optional-dependencies]
# The theme is a test dependency (tests/test_theme.py); shellcheck-py runs the shell gate on Windows.
dev = [
    # The hub's RUFF_VERSION exactly (tool-pins.env), which its consumer-pins gate checks.
    "ruff==0.16.10",
    "ty>=0.0.38",
    "pytest>=8",
    "pytest-cov>=5",
    "shellcheck-py>=0.11",
    "sphinx-kataglyphis-theme",
]
# The theme brings the Sphinx stack and the brand, so these docs keep no second baseline.
docs =["sphinx>=9,<10", "sphinx-kataglyphis-theme"]

[project.urls]
Homepage = "https://jonasheinle.de"
Repository = "https://github.com/Kataglyphis/DocumANTation"

# Not installed: it runs from a mounted volume and resolves templates relative to the repo root.
[tool.uv]
package = false

[tool.uv.sources]
# The theme lives in this repo; install it from the checkout, not from an index.
sphinx-kataglyphis-theme = { path = "sphinx-kataglyphis-theme", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# sphinx_kataglyphis ships the brand to every downstream repo, so it is measured too.
addopts = "-ra --cov=md2pdfLib --cov=style --cov=sphinx_kataglyphis --cov-report=term-missing"

[tool.ty]
# Type-checking environment for `ty check`.
environment = { python-version = "3.14" }

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
